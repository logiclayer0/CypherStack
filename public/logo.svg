<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="outerHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7931a"/>
      <stop offset="50%" stop-color="#ffab3d"/>
      <stop offset="100%" stop-color="#f7931a"/>
    </linearGradient>
    <linearGradient id="innerHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f7931a"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f7931a"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7931a" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="hardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="#0a0a0f"/>
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)"/>

  <polygon points="256,60 400,144 400,312 256,396 112,312 112,144"
           fill="none"
           stroke="url(#outerHex)"
           stroke-width="10"
           stroke-linejoin="round"
           filter="url(#softGlow)"/>

  <polygon points="256,60 400,144 400,312 256,396 112,312 112,144"
           fill="none"
           stroke="#f7931a"
           stroke-width="2"
           stroke-linejoin="round"
           opacity="0.6"/>

  <polygon points="256,110 360,170 360,286 256,346 152,286 152,170"
           fill="none"
           stroke="#2a2a38"
           stroke-width="3"
           stroke-linejoin="round"/>

  <line x1="256" y1="110" x2="256" y2="180" stroke="#f7931a" stroke-width="2" opacity="0.4"/>
  <line x1="360" y1="170" x2="300" y2="205" stroke="#f7931a" stroke-width="2" opacity="0.4"/>
  <line x1="360" y1="286" x2="300" y2="251" stroke="#f7931a" stroke-width="2" opacity="0.4"/>
  <line x1="256" y1="346" x2="256" y2="276" stroke="#f7931a" stroke-width="2" opacity="0.4"/>
  <line x1="152" y1="286" x2="212" y2="251" stroke="#f7931a" stroke-width="2" opacity="0.4"/>
  <line x1="152" y1="170" x2="212" y2="205" stroke="#f7931a" stroke-width="2" opacity="0.4"/>

  <circle cx="256" cy="110" r="10" fill="#f7931a" filter="url(#hardGlow)"/>
  <circle cx="256" cy="110" r="4" fill="#ffffff"/>

  <circle cx="360" cy="170" r="10" fill="#8b5cf6" filter="url(#hardGlow)"/>
  <circle cx="360" cy="170" r="4" fill="#ffffff"/>

  <circle cx="360" cy="286" r="10" fill="#f7931a" filter="url(#hardGlow)"/>
  <circle cx="360" cy="286" r="4" fill="#ffffff"/>

  <circle cx="256" cy="346" r="10" fill="#22c55e" filter="url(#hardGlow)"/>
  <circle cx="256" cy="346" r="4" fill="#ffffff"/>

  <circle cx="152" cy="286" r="10" fill="#f7931a" filter="url(#hardGlow)"/>
  <circle cx="152" cy="286" r="4" fill="#ffffff"/>

  <circle cx="152" cy="170" r="10" fill="#8b5cf6" filter="url(#hardGlow)"/>
  <circle cx="152" cy="170" r="4" fill="#ffffff"/>

  <circle cx="256" cy="228" r="44" fill="url(#coreGlow)" filter="url(#softGlow)"/>
  <circle cx="256" cy="228" r="34" fill="#0a0a0f"/>
  <circle cx="256" cy="228" r="24" fill="url(#coreGlow)"/>
  <circle cx="256" cy="228" r="12" fill="#0a0a0f"/>
  <circle cx="256" cy="228" r="5" fill="#ffffff" filter="url(#hardGlow)"/>
</svg>
